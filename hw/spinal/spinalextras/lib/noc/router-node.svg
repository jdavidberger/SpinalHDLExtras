<!-- ===== CROSSBAR CANDIDATE LINES ===== -->
<!-- generic rule: a port may target any output except its own canonical port, UNLESS that port is Local (canonical port 0), which is exempt and may target itself. -->
<path d="M320,189 C 420,259 580,259 680,182" fill="none" stroke="#7a7f87" stroke-width="1.6" stroke-opacity="0.5" marker-end="url(#arrowC0)"/>
<text x="500" y="275" text-anchor="middle" font-size="9" font-style="italic" fill="#6b6f76">Local·vc0 → Local-out: a locally-addressed packet loops back to local delivery</text>
<path d="M320,189 C 500,189 500,449 680,449" fill="none" stroke="#7a7f87" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC0)"/>
<path d="M320,189 C 500,189 500,641 680,641" fill="none" stroke="#7a7f87" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC0)"/>
<path d="M320,419 C 500,419 500,182 680,182" fill="none" stroke="#4b6fa8" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC1)"/>
<path d="M320,419 C 500,419 500,641 680,641" fill="none" stroke="#4b6fa8" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC1)"/>
<path d="M320,493 C 500,493 500,182 680,182" fill="none" stroke="#4b6fa8" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC1)"/>
<path d="M320,493 C 500,493 500,641 680,641" fill="none" stroke="#b8863b" stroke-width="3" stroke-opacity="0.95" marker-end="url(#arrowAccent)"/>
<path d="M320,611 C 500,611 500,182 680,182" fill="none" stroke="#4a8a55" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC2)"/>
<path d="M320,611 C 500,611 500,449 680,449" fill="none" stroke="#4a8a55" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC2)"/>
<path d="M320,685 C 500,685 500,182 680,182" fill="none" stroke="#4a8a55" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC2)"/>
<path d="M320,685 C 500,685 500,449 680,449" fill="none" stroke="#4a8a55" stroke-width="1.3" stroke-opacity="0.32" marker-end="url(#arrowC2)"/>
<text x="610" y="724" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8a5a1a">example: ClockWise·vc1 wins CounterClockWise-out's grant — held (wormhole-locked) until its packet's last flit fires io.release</text>
<!-- ===== LEGEND ===== -->
<text x="106" y="762" font-size="12" font-weight="600" fill="#1c2b40">Legend</text>
<rect x="106" y="772" width="16" height="16" rx="3" fill="#eef6ee" stroke="#4a8a55"/>
<text x="128" y="784" font-size="11" fill="#333">StreamFifo(depth=vcDepth) — per-VC buffering, one per lane</text>
<rect x="106" y="792" width="16" height="16" rx="3" fill="#f2f2f2" stroke="#888"/>
<text x="128" y="804" font-size="11" fill="#333">FlitRouter — holds resolved dest port until last flit (registered)</text>
<rect x="640" y="772" width="16" height="16" rx="3" fill="#f5eef7" stroke="#8a4a97"/>
<text x="662" y="784" font-size="11" fill="#333">VirtualIdAllocator — one GrantTableCrossbar per output port</text>
<rect x="640" y="792" width="16" height="16" rx="3" fill="#fdf3e3" stroke="#b8863b"/>
<text x="662" y="804" font-size="11" fill="#333">OutputPort — StreamArbiter merges 2 granted VC streams onto one physical link</text>
<line x1="106" y1="818" x2="136" y2="818" stroke="#b8863b" stroke-width="3"/>
<text x="142" y="822" font-size="11" fill="#333">one example granted (wormhole-locked) path</text>
<text x="106" y="838" font-size="10.5" fill="#555">Candidate lines never target the source's own canonical port (no U-turns) — except Local, which may target Local (self-delivery).</text>
